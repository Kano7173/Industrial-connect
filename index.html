<script>
(function(){
const root=document.getElementById('app');
function render(){root.innerHTML=`<div class="x-site"><nav class="x-nav"><a class="x-brand" href="#top"><span class="x-logo">IC</span><span>INDUSTRIAL CONNECT</span></a><div class="x-links"><a href="#workflow">Workflow</a><a href="#network">Network</a><a href="#order">Order Room</a></div><div class="x-nav-actions"><button class="x-btn ghost" onclick="openAuth('signin')">Sign in</button><button class="x-btn primary" onclick="openRFQ()">Post requirement ↗</button></div></nav>

<div class="x-ticker"><div class="x-track"><span>BUYER REQUIREMENT <b>→</b></span><span>SUPPLIER MATCH <b>→</b></span><span>STRUCTURED QUOTE <b>→</b></span><span>PRODUCTION <b>→</b></span><span>QC <b>→</b></span><span>DELIVERY <b>→</b></span><span>BUYER ACCEPTANCE <b>→</b></span><span>BUYER REQUIREMENT <b>→</b></span><span>SUPPLIER MATCH <b>→</b></span><span>STRUCTURED QUOTE <b>→</b></span></div></div>
<section class="x-section" id="workflow"><div class="x-section-head x-reveal"><span class="x-eyebrow">01 / THE SYSTEM</span><h2>One requirement.<br><em>One connected flow.</em></h2><p>IndustrialConnect is built around the job to be made, not a directory of random suppliers. Every stage keeps the commercial and production context attached.</p></div><div class="x-cards x-reveal">${[['01','SOURCE','Post drawing, quantity, material and delivery.'],['02','MATCH','Route the requirement to relevant manufacturing capabilities.'],['03','COMPARE','Review structured quotations on the same requirement.'],['04','PROVE','Track production, QC, dispatch and acceptance evidence.']].map(a=>`<article class="x-card"><b>${a[0]}</b><h3>${a[1]}</h3><p>${a[2]}</p></article>`).join('')}</div></section>
<section class="x-section alt" id="network"><div class="x-network"><div class="x-map x-reveal"><span class="pin p1"></span><span class="pin p2"></span><span class="pin p3"></span><span class="pin p4"></span><div class="x-map-label"><b>GUJARAT → INDIA</b><span>INITIAL MANUFACTURING CAPACITY NETWORK</span></div></div><div class="x-reveal"><span class="x-eyebrow">02 / MANUFACTURING NETWORK</span><h2>Find capacity<br><em>by capability.</em></h2><p>Start with the process your part needs. CNC turning, VMC, investment casting, fabrication, laser cutting, sheet metal, grinding, forging and more.</p><div class="x-list"><div><b>CNC Turning / VMC</b><span>PRECISION</span></div><div><b>Investment Casting</b><span>CASTING</span></div><div><b>Machinery Job Work</b><span>CAPACITY</span></div><div><b>Fabrication / Laser</b><span>FABRICATION</span></div></div></div></div></section>
<section class="x-section" id="order"><div class="x-order"><div class="x-reveal"><span class="x-eyebrow">03 / ORDER ROOM</span><h2>Production is no longer a <em>black box.</em></h2><p>Material evidence, production progress, quality documents, dispatch proof and buyer inspection stay connected to the order.</p><button class="x-btn primary" onclick="openAuth('signup','buyer')">Create buyer workspace →</button></div><div class="x-room x-reveal"><div class="x-room-top"><div><small>ORDER</small><b style="display:block;margin-top:5px;font:600 15px 'Space Grotesk'">IC-2026-000128</b></div><span class="x-status">● IN PRODUCTION</span></div><div class="x-room-row"><b>CNC precision shaft · 2,000 pcs</b><span>LIVE</span></div><div class="x-room-row"><div style="width:100%"><div style="display:flex;justify-content:space-between"><b>Production</b><span>68%</span></div><div class="x-bar"><i></i></div></div></div><div class="x-room-row"><b>Material received</b><span>✓ Complete</span></div><div class="x-room-row"><b>Quality inspection</b><span>Next gate</span></div><div class="x-room-row"><b>Dispatch</b><span>Pending</span></div></div></div></section>
<section class="x-final x-reveal"><span class="x-eyebrow">04 / START A TRANSACTION</span><h2>Make sourcing<br><em>feel simple.</em></h2><p style="margin:0 auto 28px;color:#818c96;max-width:530px;line-height:1.6">Post one real requirement. Let IndustrialConnect organize the matching, quotation and order journey.</p><button class="x-btn primary" onclick="openRFQ()">Post your requirement ↗</button></section><footer class="x-footer"><span>© 2026 IndustrialConnect India</span><span>Procurement · Production · Quality · Delivery</span></footer></div>`;bind();}
function bind(){const stage=document.getElementById('xStage'),core=document.getElementById('xCore');if(stage&&core&&matchMedia('(pointer:fine)').matches){stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;core.style.setProperty('--ry',(x*18)+'deg');core.style.setProperty('--rx',(-y*18)+'deg')});stage.addEventListener('pointerleave',()=>{core.style.setProperty('--ry','0deg');core.style.setProperty('--rx','0deg')})}addEventListener('scroll',()=>{const y=scrollY;core.style.setProperty('--scroll',y);if(stage)stage.style.transform='translateY('+Math.min(y*.045,32)+'px)'},{passive:true});const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.12});document.querySelectorAll('.x-reveal').forEach(e=>io.observe(e));}
