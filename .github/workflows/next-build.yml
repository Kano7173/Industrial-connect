name: RFQWorks build check

on:
  push:
    branches: ['rfqworks-production']
  pull_request:
    branches: ['rfqworks-production']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - name: Build Next.js
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/industrialconnect
        run: npm run build
